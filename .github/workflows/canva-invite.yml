name: Canva Auto-Invite

on:
  repository_dispatch:
    types: [trigger-invite]
  workflow_dispatch:
    inputs:
      targetEmail:
        description: 'Email address to invite'
        required: true

jobs:
  invite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Canva Invite Script
        env:
          TARGET_EMAIL: ${{ github.event.client_payload.targetEmail || github.event.inputs.targetEmail }}
        run: npm start
